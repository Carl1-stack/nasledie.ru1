<style>
#intro{position:fixed;inset:0;z-index:9999;background:radial-gradient(120% 80% at 50% 42%,#141B3C 0%,#0A0F24 55%,#04060E 100%);overflow:hidden;touch-action:none}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .in-f{position:absolute;left:50%;top:-60px;width:26px;height:52px;margin-left:-13px;opacity:0;filter:drop-shadow(0 0 8px #F5A84288)}
#intro .in-b{position:absolute;left:50%;top:42%;width:180px;height:138px;margin:-69px 0 0 -90px;opacity:0}
#intro .in-b .birdsvg .pl{fill:url(#ibT)}#intro .in-b .birdsvg .b-body,#intro .in-b .birdsvg .hd,#intro .in-b .birdsvg .nk{fill:url(#ibB)}#intro .in-b .birdsvg .wg{fill:url(#ibW)}#intro .in-b .birdsvg .aura{fill:url(#ibA)}
#intro .in-b.open .b-wing{animation:in-wing .7s cubic-bezier(.3,0,.2,1) forwards}
@keyframes in-wing{to{transform:rotate(-80deg) scale(1.2)}}
#intro .in-x{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#FFE7A8 0%,#F59B2F55 28%,transparent 62%);opacity:0;pointer-events:none}
#intro.out{transition:opacity .55s ease,filter .55s ease;opacity:0;filter:brightness(1.6)}
</style>

e cx="110" cy="19" r="1.9"/><circle cx="115" cy="41" r="1.9"/><circle cx="112" cy="72" r="1.9"/><circle cx="94" cy="86" r="1.9"/></g></g><path class="b-body" d="M35 47 C34 34 46 27 58 31 C70 35 74 50 67 59 C60 67 39 65 35 47Z"/><path class="sc" d="M40 44 q3 3 6 0 M39 49 q3 3 6 0 M45 52 q3 3 6 0 M42 56 q3 3 6 0"/><g class="b-wing"><path class="wg" d="M48 39 C60 33 72 37 75 48 C72 47 70 49 68 51 C66 49 63 50 61 53 C59 51 56 52 55 55 C51 50 48 45 48 39Z"/><path class="wl" d="M53 41 q9 -2 15 4 M52 45 q8 -1 12 4"/></g><g class="b-head"><path class="crest" d="M33 21 q-4 -11 2 -16 M36 21 q2 -10 10 -12 M30 22 q-7 -6 -6 -14"/><circle class="cd" cx="35" cy="5" r="2.3"/><circle class="cd" cx="46" cy="9" r="2.3"/><circle class="cd" cx="24" cy="8" r="2.3"/><path class="nk" d="M36 36 C38 31 44 30 47 34 L44 40Z"/><circle class="hd" cx="34" cy="29" r="9"/><path class="ck" d="M30 33 q3 3 7 1"/><path class="beak" d="M26 27 L16 30.5 L26 33Z"/><path class="bl" d="M26 30.3 L19 30.6"/><g class="eye"><circle class="er" cx="31" cy="27.5" r="2.7"/><circle class="gl" cx="30.2" cy="26.6" r=".9"/></g><ellipse class="lid" cx="31" cy="27.5" rx="3.1" ry="3.1"/></g><path class="legs" d="M45 61 l-1 7 M51 62 l0 7 M41 68 h6 M48 69 h6"/></svg></div></div>
<script>
(function () {
  var el = document.getElementById('intro'), NI = window.NINTRO = { done: false, wait: null };
  function finish() { if (NI.done) return; NI.done = true; el.classList.add('out'); setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 600); if (NI.wait) NI.wait(); }
  var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, seen = false;
  try { seen = sessionStorage.getItem('nasl-open') === '1'; } catch (e) {}
  if (rm || seen || !el.animate) { NI.done = true; el.parentNode.removeChild(el); return; }
  el.addEventListener('pointerdown', finish);
  var c = el.querySelector('canvas'), x = c.getContext('2d'), W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1), P = [];
  c.width = W * dpr; c.height = H * dpr; x.scale(dpr, dpr);
  var cx = W / 2, cy = H * .42;
  function add(px, py, n, sp, up, col) { for (var i = 0; i < n; i++) { var a = Math.random() * 6.283, v = Math.random() * sp; P.push({ x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v - up, l: 1, d: .008 + Math.random() * .02, r: 1 + Math.random() * 2.8, c: col || (Math.random() < .5 ? '255,190,90' : '240,100,40') }); } }
  (function tick() {
    x.clearRect(0, 0, W, H); x.globalCompositeOperation = 'lighter';
    for (var i = P.length - 1; i >= 0; i--) { var p = P[i]; p.x += p.vx; p.y += p.vy; p.vy -= .012; p.vx *= .985; p.l -= p.d; if (p.l <= 0) { P.splice(i, 1); continue; }
      var g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3); g.addColorStop(0, 'rgba(' + p.c + ',' + p.l + ')'); g.addColorStop(1, 'rgba(' + p.c + ',0)'); x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, p.r * 3, 0, 7); x.fill(); }
    if (!NI.done || P.length) requestAnimationFrame(tick);
  })();
  try {   // soft whoosh, only if the phone already allows sound (never on iPhone before a tap)
    var AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'running') setTimeout(function () {
      var dur = 1.3, n = AC.sampleRate * dur, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(Math.sin(Math.PI * i / n), 2);
      var s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime; s.buffer = b; f.type = 'bandpass'; f.Q.value = .9;
      f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2200, t + dur * .6); f.frequency.exponentialRampToValueAtTime(500, t + dur);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.3, t + dur * .35); g.gain.linearRampToValueAtTime(0, t + dur);
      s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
    }, 900); else AC.close && AC.close();
  } catch (e) {}
  var E = { fill: 'forwards', easing: 'cubic-bezier(.3,0,.2,1)' }, fe = el.querySelector('.in-f'), bi = el.querySelector('.in-b'), fx = el.querySelector('.in-x');
  var fall = cy + 60, ease = Object.assign({}, E, { duration: 1200, easing: 'ease-in-out' });
  fe.animate([{ opacity: 0, transform: 'translate(0,0) rotate(-20deg)' }, { opacity: 1, transform: 'translate(22px,' + fall * .45 + 'px) rotate(25deg)' },
    { opacity: 1, transform: 'translate(-16px,' + fall * .85 + 'px) rotate(-15deg)' }, { opacity: 1, transform: 'translate(0,' + fall + 'px) rotate(0)' }], ease);
  setTimeout(function () { add(cx, cy + 12, 34, 1.3, 1.5); fe.animate([{ opacity: 1, transform: 'translate(0,' + fall + 'px) scale(1)' }, { opacity: 0, transform: 'translate(0,' + (fall - 10) + 'px) scale(2.4)' }], Object.assign({}, E, { duration: 400 })); }, 1150);
  setTimeout(function () {
    add(cx, cy, 80, 3.2, .8, '255,215,140'); fx.animate([{ opacity: 0 }, { opacity: .9 }, { opacity: 0 }], Object.assign({}, E, { duration: 650 }));
    bi.animate([{ opacity: 0, transform: 'scale(.3)', filter: 'brightness(3)' }, { opacity: 1, transform: 'scale(1.15)', filter: 'brightness(1)' }], Object.assign({}, E, { duration: 650 }));
    bi.classList.add('open');
  }, 1350);
  setTimeout(function () { add(cx, cy, 40, 2.2, .4); }, 1900);
  setTimeout(finish, 2600);
  setTimeout(finish, 6000);   // safety net
})();
