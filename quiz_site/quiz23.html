:root{--navy:#1B2A4A;--teal:#0F8B8D;--amber:#E8A33D;--amberd:#B7791F;--coral:#D1495B;--cream:#FFF8EC;--green:#2E8654;--ink:#1f2430;--card:#fff;--line:#E6DFD2}
*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Cairo,Tahoma,sans-serif;color:var(--ink)}
.ru{font-family:Montserrat,Calibri,Arial,sans-serif;direction:ltr;unicode-bidi:isolate}
header{background:var(--navy);color:#fff;padding:18px 16px 14px;text-align:center}header h1{margin:0;font-size:26px}header h1 .ru{color:var(--amber)}
header p{margin:4px 0 0;opacity:.85;font-size:15px}.brand{margin-bottom:8px}.brand .bn{color:#fff;font-weight:800;font-size:18px;text-align:center}.brand .by{font-size:14px;opacity:.9}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.bar{height:12px;background:#E9E1D2;border-radius:8px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:#6b6b6b}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-top:14px;box-shadow:0 8px 24px rgba(27,42,74,.08)}
.badge{display:inline-block;font-size:13px;font-weight:800;padding:3px 12px;border-radius:20px;color:#fff}.b-cur{background:var(--amber);color:var(--navy)}.b-rev{background:var(--green)}
.q-ru{font-size:26px;font-weight:800;color:var(--navy);margin:14px 0 2px;text-align:center}.q-ar{font-size:17px;color:#555;text-align:center;margin-bottom:14px}
.play{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px auto 16px;background:var(--coral);color:#fff;border:0;border-radius:40px;padding:12px 26px;font:700 17px Cairo;cursor:pointer;box-shadow:0 6px 16px rgba(209,73,91,.35)}
.play:active{transform:scale(.97)}
.opts{display:grid;gap:10px}.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;font-size:20px;font-weight:700;cursor:pointer;text-align:center;transition:.15s;color:var(--ink)}
.opt:hover{border-color:var(--teal)}.opt.ok{background:#E6F4EA;border-color:var(--green)}.opt.bad{background:#FDECEE;border-color:var(--coral)}.opt[disabled]{cursor:default}
.opt.emoji{font-size:44px;padding:8px}
.fb{display:none;margin-top:14px;border-radius:14px;padding:12px 16px;font-size:16px;line-height:1.7}.fb.ok{display:block;background:#E6F4EA;border-right:6px solid var(--green)}.fb.bad{display:block;background:#FDECEE;border-right:6px solid var(--coral)}
.next{display:none;margin:16px auto 0;background:var(--navy);color:#fff;border:0;border-radius:14px;padding:12px 30px;font:800 17px Cairo;cursor:pointer}
.res{text-align:center}.big{font-size:56px;font-weight:800;color:var(--navy);font-family:Montserrat}.split{display:flex;gap:12px;justify-content:center;margin:16px 0}
.split div{flex:1;border-radius:16px;padding:14px;color:#fff}.split .c{background:var(--amberd)}.split .r{background:var(--green)}.split b{font-size:30px;display:block;font-family:Montserrat}
.again{background:var(--teal);color:#fff;border:0;border-radius:14px;padding:12px 26px;font:800 17px Cairo;cursor:pointer;margin-top:10px}
input.name{width:100%;border-radius:12px;border:1px solid var(--line);padding:12px;font:18px Cairo;text-align:center}
.note{margin-top:10px;font-size:15px;color:#555}
textarea{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--line);padding:10px;font:16px Cairo;margin-top:8px}
footer{text-align:center;color:#888;font-size:13px;padding:20px}

let CUR=null,i=0,score={cur:[0,0],rev:[0,0]},answered=false,stu='',wrong=[];const audio=new Audio();audio.preload='auto';audio.setAttribute('playsinline','');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const t=(s,ru)=>ru?`<span class="ru">${esc(s)}</span>`:esc(s);
// Cyrillic chunks inside Arabic text get their own LTR isolate
// Russian inside Arabic: an isolated left-to-right island. Sentence punctuation AFTER the Russian
// stays outside (it belongs to the Arabic sentence, or it shows up on the wrong side: «= .су́мка»);
// a «…» quotation is kept whole.
function isoRu(m){let pre='',core=m,trail=(m.match(/[\s.,;:!?…]*$/)||[''])[0];core=m.slice(0,m.length-trail.length);
  if(core.startsWith('«')&&!core.includes('»')){pre='«';core=core.slice(1);}
  if(core.endsWith('»')&&!core.includes('«')){core=core.slice(0,-1);trail='»'+trail;}
  if(!core)return m;return pre+'<span class="ru">'+core+'</span>'+trail;}
const mix=s=>esc(s).replace(/«?[Ѐ-ӿ][Ѐ-ӿ́\s.,!?…—\-«»\/]*/g,isoRu);
// Arabic word inside a Russian prompt: isolated right-to-left island
const mixAr=s=>esc(s).replace(/([؀-ۿ][؀-ۿ\s]*[؀-ۿ]|[؀-ۿ])/g,'<bdi dir="rtl">$1</bdi>');
let run=0;
async function play(list){const me=++run;for(const k of list){if(me!==run)return;audio.src=AUD[k];
  const ok=await new Promise(r=>{audio.onended=()=>r(true);audio.onerror=()=>r(false);audio.play().catch(()=>r(false));});
  if(!ok||me!==run)return;await new Promise(r=>setTimeout(r,350));}}

  const q=Object.assign({},q0,{o:ord.map(k=>q0.o[k]),c:ord.indexOf(q0.c)}); CUR=q;
  document.getElementById('cnt').textContent=`سؤال ${i+1} من ${Q.length}`;

function pick(j){ if(answered)return;answered=true;const q=CUR;const bs=[...document.querySelectorAll('.opt')];

    if(box)box.textContent=okMsg;}catch(e){if(box)box.textContent='⚠️ النتيجة موصلتش (النت؟). صوّر الشاشة وابعتها للمدرس.';}}
function sendComment(){const c=document.getElementById('cm').value.trim();if(!c)return;
  send({type:'quiz_comment',name:stu,lesson:LESSON_TAG,comment:c},'✅ رأيك وصل للمدرس. شكرًا!');}
// start screen: the student's name (remembered on this phone for the next quizzes); the tap on «ابدأ» also lets iPhone play sound
function start(){let n='';try{n=localStorage.getItem('nasledie_name')||''}catch(e){}
  document.getElementById('stage').innerHTML=`<div class="card" style="text-align:center">
   <div style="font-size:20px;font-weight:800;margin-bottom:10px">👋 أهلًا! اكتب اسمك وابدأ</div>
   <input class="name" id="nm" placeholder="اسمك" value="${esc(n).replace(/"/g,'&quot;')}">
   <div class="q-ar" style="margin-top:10px">🔊 علّي صوت الموبايل: الأسئلة فيها صوت.</div>
   <button class="next" style="display:block" onclick="go()">ابدأ الكويز ←</button></div>`;}
function go(){stu=document.getElementById('nm').value.trim()||'طالب';try{localStorage.setItem('nasledie_name',stu)}catch(e){}show();}
start();
</script></body></html>
