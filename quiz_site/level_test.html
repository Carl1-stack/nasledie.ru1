:root{--navy:#1B2A4A;--teal:#0F8B8D;--amber:#E8A33D;--amberd:#B7791F;--coral:#D1495B;--red:#B71C1C;--cream:#FFF8EC;--green:#2E8654;--ink:#1f2430;--line:#E6DFD2}
*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Cairo,Tahoma,sans-serif;color:var(--ink)}
.ru{font-family:Montserrat,Calibri,Arial,sans-serif;direction:ltr;unicode-bidi:isolate}
header{background:var(--navy);color:#fff;padding:16px;text-align:center}header h1{margin:6px 0 0;font-size:24px}header h1 .ru{color:var(--amber)}
.bn{font-weight:800;font-size:18px}.by{font-size:14px;opacity:.9}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.bar{height:12px;background:#E9E1D2;border-radius:8px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:#6b6b6b}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-top:14px;box-shadow:0 8px 24px rgba(27,42,74,.08)}
.badge{display:inline-block;font-size:13px;font-weight:800;padding:3px 12px;border-radius:20px;color:#fff;background:var(--teal)}
.sk{display:inline-block;font-size:13px;font-weight:800;padding:3px 12px;border-radius:20px;background:#F3EDE2;color:var(--navy);margin-inline-start:6px}
.q-ru{font-size:24px;font-weight:800;color:var(--navy);margin:14px 0 2px;text-align:center}.q-ar{font-size:17px;color:#555;text-align:center;margin-bottom:14px}
.play{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px auto 16px;background:var(--coral);color:#fff;border:0;border-radius:40px;padding:12px 26px;font:700 17px Cairo;cursor:pointer;box-shadow:0 6px 16px rgba(209,73,91,.35)}
.opts{display:grid;gap:10px}.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;font-size:19px;font-weight:700;cursor:pointer;text-align:center;color:var(--ink)}
.opt:hover{border-color:var(--teal)}.opt.sel{background:#E7F3F3;border-color:var(--teal)}.opt.emoji{font-size:44px;padding:8px}
.idk{background:none;border:0;color:#888;font:700 15px Cairo;margin:12px auto 0;display:block;cursor:pointer;text-decoration:underline}
.btn{display:block;margin:16px auto 0;background:var(--navy);color:#fff;border:0;border-radius:14px;padding:12px 30px;font:800 17px Cairo;cursor:pointer}
.btn.green{background:var(--green)}.btn.teal{background:var(--teal)}.btn[disabled]{opacity:.4;cursor:default}
.text{background:#F7F3EA;border-radius:14px;padding:14px 16px;font-size:18px;line-height:1.8;color:var(--navy);text-align:left;margin-bottom:10px}
input.ans,textarea{width:100%;border-radius:12px;border:2px solid var(--line);padding:12px;font:20px Montserrat,Arial;direction:ltr;text-align:left}
textarea{min-height:140px;font-size:18px}input.name{direction:rtl;text-align:right;font:18px Cairo}
.kb{margin-top:10px;direction:ltr;user-select:none}.kb div{display:flex;justify-content:center;gap:4px;margin-bottom:4px}
.kb button{flex:1;max-width:44px;height:42px;border:1px solid var(--line);background:#fff;border-radius:8px;font:700 17px Montserrat;cursor:pointer;padding:0}
.kb button.w{max-width:120px;flex:3}.kb button:active{background:#E7F3F3}
.wc{font-size:14px;color:#888;margin-top:6px}
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px}
.mic{width:86px;height:86px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:36px;cursor:pointer;box-shadow:0 6px 18px rgba(183,28,28,.35)}
.mic.on{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08)}}
.timer{font:800 22px Montserrat;color:var(--navy)}

"ar": "كمّل: رغم المطر خرجنا نتمشى", "o": [["дождь", true], ["дождя́", true], ["дождём", true]], "c": 0}, {"t": "write", "ar": "اكتب رأيك بالروسي (10–12 جملة): التعلّم عن طريق الإنترنت أحسن ولا الدراسة في الفصل؟ وليه؟", "words": 90}, {"t": "speak", "ru": "Мо́жно вы́учить язы́к то́лько по интерне́ту? Почему́?", "ar": "اتكلم دقيقة ونص: قول رأيك واشرح ليه، وادّي مثال.", "sec": 120, "a": "h280ea5a02a"}]}], TX={"a1": "Приве́т! Меня́ зову́т Ли́за. Я студе́нтка, я живу́ в Москве́. Я говорю́ по-ру́сски и немно́го по-ара́бски. Днём я учу́сь, а ве́чером рабо́таю в кафе́. Я о́чень люблю́ му́зыку и кино́.", "a2": "Ле́том я е́здил к бра́ту в Каза́нь. Он живёт там уже́ пять лет и рабо́тает инжене́ром. Мы мно́го гуля́ли, ходи́ли в музе́и и е́ли вку́сную тата́рскую еду́. Мне о́чень понра́вился э́тот го́род. В сле́дующем году́ я опя́ть пое́ду туда́, но уже́ с жено́й.", "b1": "Ра́ньше Мари́на рабо́тала в большо́й компа́нии и проводи́ла в о́фисе по де́сять часо́в в день. Год наза́д она́ реши́ла уйти́ и откры́ть свою́ ма́ленькую пека́рню. Снача́ла бы́ло тру́дно: де́нег не хвата́ло, а покупа́телей бы́ло ма́ло. Но сейча́с у неё есть постоя́нные клие́нты, и она́ говори́т, что впервы́е занима́ется де́лом, кото́рое ей действи́тельно нра́вится.", "b2": "Удалённая рабо́та, ещё неда́вно каза́вшаяся привиле́гией немно́гих, ста́ла для миллио́нов люде́й обы́чной пра́ктикой. Сторо́нники тако́го форма́та подчёркивают эконо́мию вре́мени на доро́гу и возмо́жность са́мому плани́ровать свой день. Одна́ко психо́логи предупрежда́ют: когда́ грани́ца ме́жду рабо́той и ли́чной жи́знью исчеза́ет, челове́к риску́ет постоя́нно чу́вствовать уста́лость. По их мне́нию, гла́вное — чёткий режи́м и отде́льное рабо́чее ме́сто, да́же е́сли э́то всего́ лишь у́гол на ку́хне."}, AUD={"h2b70868027": "data:audio/mpeg;base64,SUQzBAAAAAAAIlRTU0UAAAAOAAADTGF2ZjYzLjEuMTAyAAAAAAAAAAAAAAD/84TAAAAAAAAAAAAASW5mbwAAAA8AAAAlAAASGAARERcXFx4eHiUlKysrMjIyOTk/Pz9GRkZMTExTU1paWmBgYGdnbm5udHR0e3uBgYGIiIiPj4+VlZycnKOjo6mpsLCwt7e3vb3ExMTKys   document.getElementById('cnt').textContent=`${done} من ${TOTAL}`;}

function start(){S().innerHTML=`<div class="card"><h2 style="margin-top:0;color:var(--navy)">أهلًا بيك 👋</h2>
 <p>الاختبار ده بيحدد مستواك في الروسي ومنين تبدأ الكورس. فيه 5 مستويات، من الحروف لحد <span class="ru">B2</span>، وبيختبر 4 مهارات:</p>
 <ul class="steps"><li>🎧 الاستماع</li><li>📖 القراءة</li><li>✍️ الكتابة (فيه كيبورد روسي في الصفحة)</li><li>🎙️ الكلام (هتسجّل صوتك)</li></ul>
 <div class="note">⏱️ الوقت حوالي 40 دقيقة. البس سماعات، واقعد في مكان هادي.<br>❓ لو مش عارف الإجابة دوس «مش عارف»، متخمنش. كده النتيجة هتطلع مظبوطة.<br>✅ مش هتعرف الصح والغلط وإنت بتحل، هتشوف النتيجة كلها في الآخر.</div>
 <p style="margin-bottom:4px;font-weight:700">اسمك:</p><input class="name" id="nm" placeholder="اكتب اسمك هنا">
 <button class="btn green" onclick="stu=document.getElementById('nm').value.trim()||'طالب';next()">ابدأ الاختبار ←</button></div>`;}

function next(){stop();if(i>=FLAT.length)return result();const q=FLAT[i];bar();
  document.getElementById('lv').innerHTML=mix(LV[q.li].ar);
  ({intro,mc,type:typ,write,speak})[q.t](q);}
function go(){i++;next();window.scrollTo(0,0);}

function intro(q){const l=LV[q.li];S().innerHTML=`<div class="card lvl"><div class="small">الجزء ${q.li+1} من ${LV.length}</div>
 <div class="big">${mix(l.ar)}</div><div class="q-ru ru" style="font-size:20px">${esc(l.ru)}</div>
 <p>${q.li==0?'نبدأ بالحروف والقراءة.':'المستوى ده أصعب شوية. لو حسيت إنه صعب عليك، عادي جدًا: دوس «مش عارف» وكمّل.'}</p>
 <button class="btn" onclick="go()">يلا ←</button></div>`;}

function head(q){return `<span class="badge">${mix(LV[q.li].ar)}</span><span class="sk">${SK[q.s||q.t]}</span>`;}
function mc(q){let ord=q.o.map((_,k)=>k);for(let k=ord.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[ord[k],ord[r]]=[ord[r],ord[k]];}
  const emoji=q.o.every(o=>!o[1]&&/\p{Extended_Pictographic}/u.test(o[0]));
  S().innerHTML=`<div class="card">${head(q)}
   ${q.text?`<div class="text ru" style="margin-top:12px">${esc(TX[q.text])}</div>`:''}
   <div class="q-ru ru">${mixAr(q.ru)}</div><div class="q-ar">${mix(q.ar)}</div>
   ${q.a?`<button class="play" onclick="play('${q.a}')">🎧 اسمع</button>`:''}
   <div class="opts">${ord.map(k=>`<button class="opt ${emoji?'emoji':''}" onclick="pick(this,${k})">${q.o[k][1]?'<span class="ru">'+esc(q.o[k][0])+'</span>':esc(q.o[k][0])}</button>`).join('')}</div>
   <button class="idk" onclick="pick(null,-1)">🤷 مش عارف</button></div>`;
  if(q.a)setTimeout(()=>play(q.a),350);}
function pick(b,k){const q=FLAT[i];if(b){document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');}
  const ok=k===q.c;ans[i]=k;score[q.li]+=ok?1:0;skill[q.s][1]++;if(ok)skill[q.s][0]++;done++;setTimeout(go,b?350:0);}

const ROWS=['йцукенгшщзхъ','фывапролджэ','ячсмитьбюё'];
function kb(id){return `<div class="kb">${ROWS.map(r=>`<div>${[...r].map(c=>`<button type="button" onclick="key('${id}','${c}')">${c}</button>`).join('')}</div>`).join('')}
 <div><button type="button" class="w" onclick="key('${id}',' ')">مسافة</button><button type="button" class="w" onclick="key('${id}','⌫')">⌫</button></div></div>`;}
function key(id,c){const e=document.getElementById(id);if(c=='⌫')e.value=e.value.slice(0,-1);else e.value+=c;e.dispatchEvent(new Event('input'));}
const norm=s=>s.toLowerCase().replace(/[́']/g,'').replace(/ё/g,'е').replace(/[^а-я]/g,'');
function typ(q){S().innerHTML=`<div class="card">${head(q)}<div class="q-ar" style="margin-top:12px">${mix(q.ar)}</div>
  <button class="play" onclick="play('${q.a}')">🎧 اسمع</button><input class="ans" id="ta" autocomplete="off" autocapitalize="off" spellcheck="false">${kb('ta')}
  <button class="btn" onclick="typed()">تأكيد ←</button><button class="idk" onclick="typed(true)">🤷 مش عارف</button></div>`;setTimeout(()=>play(q.a),350);}
function typed(skip){const q=FLAT[i];const v=skip?'':document.getElementById('ta').value;const ok=!skip&&norm(v)===norm(q.ans);
  ans[i]=v;score[q.li]+=ok?1:0;skill.dict[1]++;if(ok)skill.dict[0]++;done++;go();}

function write(q){S().innerHTML=`<div class="card">${head(q)}<div class="q-ar" style="margin-top:12px;font-weight:700">${mix(q.ar)}</div>
  <textarea id="wa" placeholder="Пиши́те здесь…" spellcheck="false"></textarea><div class="wc" id="wc">0 كلمة · المطلوب حوالي ${q.words}</div>${kb('wa')}
  <button class="btn" onclick="wrote()">التالي ←</button><button class="idk" onclick="wrote(true)">🤷 مش قادر أكتب في المستوى ده</button></div>`;
  const t=document.getElementById('wa');t.addEventListener('input',()=>{document.getElementById('wc').textContent=`${t.value.trim().split(/\s+/).filter(Boolean).length} كلمة · المطلوب حوالي ${q.words}`;});}
function wrote(skip){const q=FLAT[i];const v=skip?'':document.getElementById('wa').value.trim();writing.push({lv:LV[q.li].id,task:q.ar,text:v});done++;go();}

let mr=null,chunks=[],tmr=null,blob=null;
function speak(q){blob=null;const can=!!(navigator.mediaDevices&&window.MediaRecorder);
  S().innerHTML=`<div class="card">${head(q)}<div class="q-ru ru">${mixAr(q.ru)}</div>
   ${q.text?`<div class="text ru">${esc(q.text)}</div>`:''}<div class="q-ar">${mix(q.ar)}</div>
   ${q.a?`<button class="play" onclick="play('${q.a}')">🎧 اسمع السؤال</button>`:''}
   ${can?`<div class="rec"><button class="mic" id="mic" onclick="rec()">🎙️</button><div class="timer" id="tm">0:00 / ${fmt(q.sec)}</div><div class="small" id="rs">دوس على المايك وابدأ تتكلم، ودوس تاني لما تخلص.</div><div id="pb"></div></div>`
        :`<div class="note">🎙️ المايك مش شغال في الصفحة دي. سجّل إجابتك فويس نوت على واتساب وابعتها للمدرس، وبعدين دوس «التالي».</div>`}
   <button class="btn" id="nx" onclick="spoke()">التالي ←</button><button class="idk" onclick="spoke(true)">🤷 مش قادر أتكلم في المستوى ده</button></div>`;
  if(q.a)setTimeout(()=>play(q.a),350);}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
async function rec(){const q=FLAT[i];const m=document.getElementById('mic');
  if(mr&&mr.state==='recording'){mr.stop();return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){document.getElementById('rs').textContent='المتصفح مسمحش بالمايك. اسمح بيه من إعدادات المتصفح، أو ابعت فويس نوت على واتساب.';return;}
  stop();const type=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  mr=new MediaRecorder(stream,type?{mimeType:type}:{});chunks=[];let s=0;
  mr.ondataavailable=e=>chunks.push(e.data);
  mr.onstop=()=>{clearInterval(tmr);stream.getTracks().forEach(t=>t.stop());m.classList.remove('on');m.textContent='🎙️';
    blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});const u=URL.createObjectURL(blob);
    document.getElementById('pb').innerHTML=`<audio controls src="${u}"></audio>`;document.getElementById('rs').textContent='✅ اتسجّل. اسمعه، ولو عايز تعيد دوس على المايك تاني.';};
  mr.start();m.classList.add('on');m.textContent='⏹';document.getElementById('rs').textContent='بيسجّل… اتكلم دلوقتي.';
  tmr=setInterval(()=>{s++;document.getElementById('tm').textContent=fmt(s)+' / '+fmt(q.sec);if(s>=q.sec)mr.stop();},1000);}
function spoke(skip){const q=FLAT[i];if(mr&&mr.state==='recording'){mr.stop();setTimeout(()=>spoke(skip),300);return;}
  if(!skip&&blob)recs.push({lv:LV[q.li].id,blob});done++;go();}

function placement(){const f=score.findIndex(s=>s<PASS);const s=score;
  if(f===0)return 'من الصفر: الحروف والقراءة (الدرس 1)';
  if(f===1)return s[1]<=3?'المستوى A1 من الأول (الدرس 2)':s[1]<=6?'المستوى A1: الوحدة 2 (الدرس 6)':'المستوى A1: الوحدة 4 (الدرس 16)';
  if(f===2)return s[1]<11?'المستوى A1: الوحدة 5 (الدرس 21)، وبعدها A2':'المستوى A2 من الأول';
  if(f===3)return 'المستوى B1 من الأول';
  if(f===4)return 'المستوى B2 من الأول';
  return 'أعلى من B2: المدرس هيحدد بعد ما يسمعك';}
function summary(){const lines=['اختبار تحديد المستوى · Наследие','الاسم: '+stu,'التاريخ: '+new Date().toLocaleDateString('ar-EG'),'',
  'النتيجة: '+placement(),'',...LV.map((l,k)=>`${l.id}: ${score[k]}/12`),'',
  ...Object.keys(skill).map(k=>`${SK[k]}: ${skill[k][0]}/${skill[k][1]}`),'','الكتابة:',
  ...writing.map(w=>`[${w.lv}] ${w.text||'(مكتبش)'}`),'',`التسجيلات: ${recs.length}`];return lines.join('\n');}
function result(){document.getElementById('bar').style.width='100%';document.getElementById('cnt').textContent='خلصت 🎉';document.getElementById('lv').textContent='';
  const ext=b=>/mp4|aac/.test(b.type)?'m4a':'webm';
  const files=recs.map((r,k)=>new File([r.blob],`${stu}_${r.lv}.${ext(r.blob)}`,{type:r.blob.type}));
  files.push(new File([summary()],`${stu}_النتيجة.txt`,{type:'text/plain'}));window._files=files;
  const col=k=>score[k]>=PASS?'var(--green)':score[k]>=6?'var(--amber)':'var(--coral)';
  S().innerHTML=`<div class="card"><div class="small" style="text-align:center">مستواك المبدئي، ابدأ من:</div><div class="result">${mix(placement())}</div>
   <div class="rows">${LV.map((l,k)=>`<div class="row"><b>${l.id=='L0'?'الحروف':l.id}</b><div class="t"><i style="width:${score[k]/12*100}%;background:${col(k)}"></i></div><span>${score[k]}/12</span></div>`).join('')}</div>
   <div class="rows">${Object.keys(skill).map(k=>`<div class="row"><b style="font-family:Cairo">${SK[k]}</b><div class="t"><i style="width:${skill[k][1]?skill[k][0]/skill[k][1]*100:0}%;background:var(--teal)"></i></div><span>${skill[k][0]}/${skill[k][1]}</span></div>`).join('')}</div>
   <div class="note">📩 المهم دلوقتي: ابعت النتيجة والكتابة والتسجيلات (${recs.length}) للمدرس. هو هيسمعك ويقرا كتابتك ويأكدلك المستوى النهائي.</div>
   <button class="btn green" onclick="share()">📤 ابعت كل حاجة للمدرس</button>
   <button class="btn teal" onclick="copyRes()">📋 انسخ النتيجة</button>
   <div id="dl" class="small" style="margin-top:14px;text-align:center"></div></div>`;
  document.getElementById('dl').innerHTML=files.map(f=>`<a download="${esc(f.name)}" href="${URL.createObjectURL(f)}">⬇️ ${esc(f.name)}</a>`).join('<br>');}
async function share(){const f=window._files;try{if(navigator.canShare&&navigator.canShare({files:f})){await navigator.share({files:f,title:'اختبار المستوى',text:summary()});return;}}catch(e){if(e.name==='AbortError')return;}
  copyRes();alert('اتنسخت النتيجة. ابعتها للمدرس على واتساب، ونزّل التسجيلات من اللينكات اللي تحت وابعتها كمان.');}
function copyRes(){const t=summary();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('اتنسخت ✅ الصقها في واتساب للمدرس.')).catch(()=>{prompt('انسخ النتيجة:',t)});}
window.addEventListener('beforeunload',e=>{if(done>0&&i<FLAT.length){e.preventDefault();e.returnValue='';}});
start();
</script></body></html>
